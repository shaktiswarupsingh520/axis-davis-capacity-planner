name: Patch RCA and alert dump

on:
  push:
    branches:
      - release/axis-bank-interactive-ai-1.0.68

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          rca = Path('src/rcaButtonRecoveryV63.ts')
          s = rca.read_text()
          pattern = re.compile(r"  const name=asText\(problem\['event\.name'\]\);\n  const recurrenceRows=.*?\n  const recurrenceCountRows=.*?\n", re.S)
          replacement = '''  const name=asText(problem['event.name']);
  const selectedZone=Array.from(document.querySelectorAll<HTMLSelectElement>('.top-actions select'))[0]?.value||'All Management Zones';
  const zoneFilter=selectedZone!=='All Management Zones'?`\n| expand related_entity_names\n| lookup sourceField:related_entity_names, lookupField:entity.name,\n  [\n    fetch dt.entity.host\n    | expand managementZones\n    | filter managementZones == "${dqlEscape(selectedZone)}"\n    | fields entity.name\n  ], fields:{zoneHostName=entity.name}\n| filter isNotNull(zoneHostName)\n| dedup display_id`:'';
  const recurrenceRows=name?await runDql(`fetch dt.davis.problems, from:now()-365d, to:now()\n| filter not(dt.davis.is_duplicate) and event.name == "${dqlEscape(name)}" and display_id != "${id}"${zoneFilter}\n| fields display_id,event.name,event.status,event.severity,event.start,event.end,resolved_problem_duration,root_cause.smartscape_entity,affected_entity_ids\n| sort event.start desc\n| limit 30`,30).catch(()=>[] as Row[]):[];
  const recurrenceCountRows=name?await runDql(`fetch dt.davis.problems, from:now()-365d, to:now()\n| filter not(dt.davis.is_duplicate) and event.name == "${dqlEscape(name)}" and display_id != "${id}"${zoneFilter}\n| summarize recurrence_count=count()`,1).catch(()=>[] as Row[]):[];
'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'RCA recurrence block replacement count={n}')
          rca.write_text(s2)

          alert = Path('src/dynatraceAlertDumpV54.ts')
          s = alert.read_text()
          helper = '''function problemType(row: ProblemRecord): string {\n  const category = text(row['event.category']).toUpperCase();\n  const title = text(row['event.name']).toUpperCase();\n  const entities = text(row.affected_entity_names || row.affected_entity_ids).toUpperCase();\n  if (category === 'CUSTOM' || title.includes('CUSTOM')) return 'Custom';\n  if (entities.includes('SERVICE') || title.includes('SERVICE')) return 'Service';\n  if (entities.includes('APPLICATION') || entities.includes('WEB_APPLICATION') || title.includes('APPLICATION')) return 'Application';\n  return 'Infrastructure';\n}\n\n'''
          if 'function problemType(row: ProblemRecord)' not in s:
              s = s.replace('function severityLabel(value: unknown) {', helper + 'function severityLabel(value: unknown) {', 1)
          old = '<label>Severity<select class="alert-dump-severity"><option value="ALL">All severities</option><option value="1">Level 1 — Critical</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5 — Info</option></select></label><button class="alert-dump-load">Load problems</button>'
          new = '<label>Severity<select class="alert-dump-severity"><option value="ALL">All severities</option><option value="1">Level 1 — Critical</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5 — Info</option></select></label><label>Category<select class="alert-dump-category"><option value="ALL">All categories</option><option value="INFRASTRUCTURE">Infrastructure</option><option value="SERVICE">Service</option><option value="APPLICATION">Application</option><option value="CUSTOM">Custom</option></select></label><button class="alert-dump-load">Load problems</button>'
          if old not in s:
              raise SystemExit('Alert category control marker not found')
          s = s.replace(old, new, 1)
          old_load = """      const selectedZone = readTopbarValue(0, 'All Management Zones');
      const query = buildProblemQuery(rangeSelect.value, modal.querySelector<HTMLSelectElement>('.alert-dump-status')!.value, modal.querySelector<HTMLSelectElement>('.alert-dump-severity')!.value, selectedZone);
      rows = await executeDql(query); render();"""
          new_load = """      const selectedZone = readTopbarValue(0, 'All Management Zones');
      const category = modal.querySelector<HTMLSelectElement>('.alert-dump-category')!.value;
      const query = buildProblemQuery(rangeSelect.value, modal.querySelector<HTMLSelectElement>('.alert-dump-status')!.value, modal.querySelector<HTMLSelectElement>('.alert-dump-severity')!.value, selectedZone);
      const fetchedRows = await executeDql(query);
      rows = category === 'ALL' ? fetchedRows : fetchedRows.filter(row => problemType(row).toUpperCase() === category);
      render();"""
          if old_load not in s:
              raise SystemExit('Alert load marker not found')
          s = s.replace(old_load, new_load, 1)
          alert.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rcaButtonRecoveryV63.ts src/dynatraceAlertDumpV54.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: scope RCA recurrence and add alert category filter'
            git push origin HEAD
          fi
